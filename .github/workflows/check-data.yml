name: Check latest data daily

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: data-check
  cancel-in-progress: false

jobs:
  scrape-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch data branch
        run: git fetch origin data:data

      - name: Prepare data worktree
        run: git worktree add ../data-branch data

      - name: Prepare evidence worktree
        run: |
          if git ls-remote --exit-code --heads origin evidence >/dev/null 2>&1; then
            git fetch origin evidence:evidence
            git worktree add ../evidence-branch evidence
          else
            git worktree add --detach ../evidence-branch
            git -C ../evidence-branch switch --orphan evidence
            git -C ../evidence-branch rm -rf . || true
            mkdir -p ../evidence-branch/evidence
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Capture current snapshot size
        id: before-count
        run: |
          count=$(find ../data-branch/data -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')
          echo "value=$count" >> "$GITHUB_OUTPUT"

      - name: Acquire latest live declaration evidence
        timeout-minutes: 90
        run: |
          uv run python acquire_evidence.py \
            --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live \
            --request-retries 0 \
            --request-timeout 12 \
            --request-delay 0.4 \
            --request-jitter 0.6 \
            --workers 3 \
            --report-json ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live/acquire-report.json

      - name: Extract latest live declarations from evidence
        run: |
          uv run python extract_from_evidence.py \
            --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live \
            --data-dir ../data-branch/data \
            --report-json scrape-live-report.json

      - name: Evaluate live scrape health
        id: live-scrape-quality
        run: |
          uv run python .github/scripts/scrape_health.py \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live/acquire-report.json \
            --report scrape-live-report.json \
            --combined-report scrape-live-combined-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --emit-annotation

      - name: Notify Discord about live scrape health warnings
        if: steps.live-scrape-quality.outputs.notify == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python .github/scripts/scrape_health.py \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live/acquire-report.json \
            --report scrape-live-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --discord

      - name: Acquire supplementary declaration evidence
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        timeout-minutes: 90
        run: |
          uv run python acquire_evidence.py \
            --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary \
            --only-supplementary \
            --supplementary-ids supplementary_user_ids.txt \
            --request-retries 1 \
            --request-timeout 12 \
            --request-delay 0.8 \
            --request-jitter 1.0 \
            --workers 1 \
            --report-json ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary/acquire-report.json

      - name: Extract supplementary declarations from evidence
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        run: |
          uv run python extract_from_evidence.py \
            --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary \
            --data-dir ../data-branch/data \
            --report-json scrape-supplementary-report.json

      - name: Prepare skipped supplementary report
        if: steps.live-scrape-quality.outputs.commit_ok != 'true'
        run: |
          mkdir -p ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary
          printf '{"results":[]}\n' > ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary/acquire-report.json
          printf '{"results":[]}\n' > scrape-supplementary-report.json

      - name: Combine supplementary scrape health
        run: |
          uv run python .github/scripts/scrape_health.py \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary/acquire-report.json \
            --report scrape-supplementary-report.json \
            --combined-report scrape-supplementary-combined-report.json

      - name: Prepare failed declaration retry list
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failed = set()
          for path in [
              Path("scrape-live-combined-report.json"),
              Path("scrape-supplementary-combined-report.json"),
          ]:
              if not path.exists():
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              for result in report.get("results", []):
                  if result.get("status") == "error" and result.get("user_id"):
                      failed.add(result["user_id"])

          Path("failed-ids.txt").write_text(
              "".join(f"{user_id}\n" for user_id in sorted(failed)),
              encoding="utf-8",
          )
          PY

      - name: Acquire failed declaration retry evidence
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        timeout-minutes: 60
        run: |
          if [ -s failed-ids.txt ]; then
            uv run python acquire_evidence.py \
              --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry \
              --user-ids-file failed-ids.txt \
              --request-retries 1 \
              --request-timeout 12 \
              --request-delay 1.0 \
              --request-jitter 1.5 \
              --workers 1 \
              --report-json ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry/acquire-report.json
          else
            mkdir -p ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry
            printf '{"results":[]}\n' > ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry/acquire-report.json
          fi

      - name: Extract failed declaration retries from evidence
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        run: |
          if [ -s failed-ids.txt ]; then
            uv run python extract_from_evidence.py \
              --evidence-dir ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry \
              --data-dir ../data-branch/data \
              --report-json scrape-second-pass-report.json
          else
            printf '{"results":[]}\n' > scrape-second-pass-report.json
          fi

      - name: Prepare skipped retry report
        if: steps.live-scrape-quality.outputs.commit_ok != 'true'
        run: |
          mkdir -p ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry
          printf '{"results":[]}\n' > ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry/acquire-report.json
          cp scrape-live-report.json scrape-second-pass-report.json

      - name: Summarize scrape health
        id: scrape-quality
        if: always()
        run: |
          uv run python .github/scripts/scrape_health.py \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live/acquire-report.json \
            --report scrape-live-report.json \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary/acquire-report.json \
            --report scrape-supplementary-report.json \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry/acquire-report.json \
            --report scrape-second-pass-report.json \
            --combined-report scrape-combined-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --emit-annotation

      - name: Upload scrape health reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scrape-live-report.json
            scrape-live-combined-report.json
            scrape-supplementary-report.json
            scrape-supplementary-combined-report.json
            scrape-second-pass-report.json
            scrape-combined-report.json
            failed-ids.txt
            ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/*/manifest.json
            ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/*/manifest.sha256
            ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/*/acquire-report.json
          if-no-files-found: ignore

      - name: Notify Discord about scrape health warnings
        if: steps.scrape-quality.outputs.notify == 'true' && steps.live-scrape-quality.outputs.notify != 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run python .github/scripts/scrape_health.py \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/live/acquire-report.json \
            --report scrape-live-report.json \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/supplementary/acquire-report.json \
            --report scrape-supplementary-report.json \
            --report ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/retry/acquire-report.json \
            --report scrape-second-pass-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --discord

      - name: Externally anchor raw evidence package
        if: always()
        env:
          EVIDENCE_TSA_URL: ${{ secrets.EVIDENCE_TSA_URL }}
          EVIDENCE_SIGNING_KEY_PEM: ${{ secrets.EVIDENCE_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$EVIDENCE_TSA_URL" ] && [ -z "$EVIDENCE_SIGNING_KEY_PEM" ]; then
            echo "No evidence timestamp/signing secrets configured; skipping external anchoring."
            exit 0
          fi

          args=()
          if [ -n "$EVIDENCE_TSA_URL" ]; then
            args+=(--timestamp-url "$EVIDENCE_TSA_URL")
          fi
          if [ -n "$EVIDENCE_SIGNING_KEY_PEM" ]; then
            key_file="$(mktemp)"
            printf '%s\n' "$EVIDENCE_SIGNING_KEY_PEM" > "$key_file"
            chmod 600 "$key_file"
            args+=(--signing-key "$key_file")
          fi

          for dir in ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/*; do
            [ -f "$dir/manifest.json" ] || continue
            uv run python harden_evidence.py --evidence-dir "$dir" "${args[@]}"
          done

      - name: Validate raw evidence package
        id: validate-evidence
        if: always()
        env:
          EVIDENCE_TSA_URL: ${{ secrets.EVIDENCE_TSA_URL }}
          EVIDENCE_SIGNING_KEY_PEM: ${{ secrets.EVIDENCE_SIGNING_KEY_PEM }}
        run: |
          args=()
          if [ -n "$EVIDENCE_TSA_URL" ]; then
            args+=(--require-timestamp)
          fi
          if [ -n "$EVIDENCE_SIGNING_KEY_PEM" ]; then
            args+=(--require-signature)
          fi

          uv run python validate_evidence.py \
            --evidence-root ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }} \
            "${args[@]}"

      - name: Commit raw evidence package
        if: steps.validate-evidence.outcome == 'success'
        working-directory: ../evidence-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence

          if git diff --cached --quiet; then
            echo "No raw evidence changes detected."
            exit 0
          fi

          git commit -F - <<'EOF'
          chore: add raw scrape evidence

          Previously the daily workflow preserved only extracted YAML and
          transient CI artifacts; this commit stores the raw acquisition
          package on the evidence branch for independent review.

          - Add raw HTTP captures, metadata, manifests, and hashes
          - Keep derived declaration YAML on the data branch
          EOF

          git push origin HEAD:evidence

      - name: Package raw evidence for GitHub Releases
        if: steps.validate-evidence.outcome == 'success'
        env:
          EVIDENCE_TSA_URL: ${{ secrets.EVIDENCE_TSA_URL }}
          EVIDENCE_SIGNING_KEY_PEM: ${{ secrets.EVIDENCE_SIGNING_KEY_PEM }}
        run: |
          args=()
          if [ -n "$EVIDENCE_TSA_URL" ]; then
            args+=(--require-timestamp)
          fi
          if [ -n "$EVIDENCE_SIGNING_KEY_PEM" ]; then
            args+=(--require-signature)
          fi

          mkdir -p evidence-release-assets
          for dir in ../evidence-branch/evidence/${{ github.run_id }}-${{ github.run_attempt }}/*; do
            [ -f "$dir/manifest.json" ] || continue
            uv run python publish_evidence.py \
              --evidence-dir "$dir" \
              --output-dir evidence-release-assets \
              "${args[@]}"
          done

      - name: Attest raw evidence release assets
        if: steps.validate-evidence.outcome == 'success'
        uses: actions/attest@v4
        with:
          subject-path: evidence-release-assets/*.tar.gz

      - name: Publish raw evidence package to GitHub Releases
        if: steps.validate-evidence.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for archive in evidence-release-assets/*.tar.gz; do
            name="$(basename "$archive" .tar.gz)"
            tag="evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${name}"
            title="Evidence package ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${name}"
            notes="Raw scrape evidence package for workflow run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, segment ${name}."
            gh release create "$tag" \
              "$archive" \
              "$archive.sha256" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          done

      - name: Generate declaration content hashes
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        run: |
          uv run python generate_content_hashes.py \
            --data-dir ../data-branch/data \
            --output ../data-branch/data/_checks/content-hashes.json

      - name: Guard against suspicious data loss
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        run: |
          before=${{ steps.before-count.outputs.value }}
          after=$(find ../data-branch/data -maxdepth 1 -name '*.yaml' | wc -l | tr -d ' ')
          drop=$((before - after))

          if [ "$before" -gt 0 ] && [ "$after" -lt "$before" ] && [ "$drop" -gt 25 ] && [ $((after * 100)) -lt $((before * 95)) ]; then
            echo "Refusing to commit a suspicious drop from $before to $after declarations."
            exit 1
          fi

      - name: Detect latest reporting year
        id: latest-year
        if: steps.live-scrape-quality.outputs.commit_ok == 'true'
        run: |
          latest_year=$(python - <<'PY'
          from pathlib import Path
          import yaml

          latest = 0
          for path in Path("../data-branch/data").glob("*.yaml"):
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              year = data.get("year")
              if isinstance(year, int):
                  latest = max(latest, year)

          if not latest:
              raise SystemExit("No scraped declarations found.")

          print(latest)
          PY
          )
          echo "value=$latest_year" >> "$GITHUB_OUTPUT"

      - name: Commit updated data snapshot
        id: commit-data
        if: steps.scrape-quality.outputs.commit_ok == 'true' && steps.live-scrape-quality.outputs.commit_ok == 'true'
        working-directory: ../data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream data changes detected."
            exit 0
          fi

          uv run --project "$GITHUB_WORKSPACE" \
            python "$GITHUB_WORKSPACE/.github/scripts/data_commit_message.py" \
            --repo . \
            --latest-year "${{ steps.latest-year.outputs.value }}" \
            --output commit-message.txt

          git commit -F commit-message.txt

          git push origin HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Skip data commit after low-quality scrape
        if: steps.scrape-quality.outputs.commit_ok != 'true' || steps.live-scrape-quality.outputs.commit_ok != 'true'
        run: |
          echo "Skipping data commit because scrape error rate exceeded the quality gate."

      - name: Trigger Pages rebuild
        if: steps.commit-data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Notify Discord about changed declarations
        if: steps.commit-data.outputs.changed == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          uv run python .github/scripts/discord_data_summary.py \
            --data-repo ../data-branch \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --latest-year "${{ steps.latest-year.outputs.value }}"

      - name: Fail on severe scrape health errors
        if: steps.scrape-quality.outputs.hard_fail == 'true'
        run: |
          echo "Scrape error rate exceeded the hard failure threshold."
          exit 1

      - name: Clean up worktree
        if: always()
        run: |
          git worktree remove ../data-branch --force
          git worktree remove ../evidence-branch --force
